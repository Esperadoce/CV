version: '3.8'

services:
  cv-website:
    image: esperadoce/cv:${TAG:-latest}
    container_name: cv-website-app
    ports:
      - "127.0.0.1:28080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - default
    labels:
      - "com.docker.compose.project=cv-website"
      - "description=Personal CV Website by Hicham Bouchikhi"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-cv
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 86400 --cleanup cv-website-app

networks:
  default:
    name: nginx_network
    external: true
