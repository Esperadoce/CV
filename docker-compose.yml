version: '3.8'

services:
  cv-website:
    image: esperadoce/cv:latest
    container_name: cv-website
    ports:
      - "28080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - nginx_network
    labels:
      - "com.docker.compose.project=cv-website"
      - "description=Personal CV Website by Hicham Bouchikhi"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-cv
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --cleanup cv-website

networks:
  nginx_network:
    external: true
